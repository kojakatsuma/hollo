name: release

on:
  push:
    branches:
      - main
      - stable
      - "*.*-maintenance"
    tags:
      - "*.*.*"
  # Fork: allows re-running build-image and deploy from the Actions tab.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm
      - run: pnpm install
      - run: pnpm run check:ci
      - if: github.ref_type == 'tag'
        run: |
          set -ex
          [[ "$(jq -r .version package.json)" = "$GITHUB_REF_NAME" ]]
          ! grep -i "to be released" CHANGES.md

  build-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [check]
    # Fork: keep pushes of the same ref in order so that an older run never
    # overwrites the stable tag after a newer one.
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sergeysova/jq-action@v2
        id: version
        with:
          cmd: "jq -r .version package.json"
      - if: github.ref_type == 'tag'
        run: '[[ "$VERSION" = "$GITHUB_REF_NAME" ]]'
        env:
          VERSION: ${{ steps.version.outputs.value }}
      # Fork: stable (only on the stable branch) and sha-xxxxxxx tags are
      # used by the deploy job and for rollbacks on the VPS.
      - if: github.ref_type != 'tag'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=git-${{ github.sha }}
            type=raw,value=${{ steps.version.outputs.value }}-dev.${{ github.run_number }}
            type=raw,value=canary
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/stable' }}
            type=sha
      - if: github.ref_type != 'tag'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.value }}-dev.${{ github.run_number }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Hollo
            org.opencontainers.image.description=Federated single-user microblogging software
            org.opencontainers.image.url=https://docs.hollo.social/
            org.opencontainers.image.source=https://github.com/fedify-dev/hollo
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.version.outputs.value }}-dev.${{ github.run_number }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache,mode=max
      - if: github.ref_type == 'tag'
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64, linux/arm64
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository }}:git-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}:canary
            ghcr.io/${{ github.repository }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Hollo
            org.opencontainers.image.description=Federated single-user microblogging software
            org.opencontainers.image.url=https://docs.hollo.social/
            org.opencontainers.image.source=https://github.com/fedify-dev/hollo
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache,mode=max

  # Fork: deploys the freshly pushed stable image to the VPS.  The SSH key
  # is restricted by command= in authorized_keys to run deploy.sh only.
  deploy:
    if: |
      github.ref == 'refs/heads/stable' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # TODO: Replace with the absolute path of deploy.sh on the VPS.
          # (Ignored when authorized_keys forces command=, but used otherwise.)
          script: "'/home/<user>/hollo/deploy.sh'"

  release:
    if: github.event_name == 'push'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: extract-changelog
        uses: dahlia/submark@5a5ff0a58382fb812616a5801402f5aef00f90ce
        with:
          input-file: CHANGES.md
          heading-level: 2
          heading-title-text: version ${{ github.ref_name }}
          ignore-case: true
          omit-heading: true
      - run: 'cat "$CHANGES_FILE"'
        env:
          CHANGES_FILE: ${{ steps.extract-changelog.outputs.output-file }}
      - if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          body_path: ${{ steps.extract-changelog.outputs.output-file }}
          name: Hollo ${{ github.ref_name }}
          generate_release_notes: false

  publish-docs:
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: pnpm
      - run: |
          pnpm install
          pnpm exec astro check
          pnpm exec astro build --site "$DOCS_SITE"
        env:
          DOCS_SITE: ${{ github.ref_type == 'tag' && 'https://docs.hollo.social' || 'https://canary.docs.hollo.social' }}
          PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
        working-directory: ${{ github.workspace }}/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
      - if: github.ref_type == 'branch'
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: docs/dist
          production-branch: main
          github-token: ${{ github.token }}
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 2
      - if: github.ref_type == 'tag'
        uses: actions/deploy-pages@v4
# cSpell: ignore buildx sergeysova
